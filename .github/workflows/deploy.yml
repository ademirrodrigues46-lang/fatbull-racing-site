name: publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + checksum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Release build (gera dist/, SHA-256 e dist/release.json)
        run: npm run release:site

      - name: Resumo do artefato
        run: cat dist/release.json

      - uses: actions/upload-artifact@v4
        with:
          name: racepulse-site
          path: dist
          if-no-files-found: error

  deploy:
    name: publicar no edge
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://racepulse.pages.dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racepulse-site
          path: dist

      # Rollback: baste o artefato de uma execução anterior e rode este mesmo job.
      - name: Cloudflare Pages
        if: ${{ vars.DEPLOY_TARGET == 'cloudflare' || vars.DEPLOY_TARGET == '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name racepulse --branch main

      - name: GitHub Pages (espelho)
        if: ${{ vars.DEPLOY_TARGET == 'github' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  preview-comment:
    name: URL de preview no PR
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Build do site pronto no artifact `racepulse-site`. Faça deploy dele para revisar antes do merge."
            });
